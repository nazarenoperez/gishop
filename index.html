<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GiShop - Catálogo</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
</head>
<body>
<header>
  <div class="logo">Gi<span>Shop</span></div>
  <nav><a href="index.html" style="color:var(--txt)">Catálogo</a><a href="admin.html">Admin</a></nav>
</header>
<main>
  <div class="card">
    <div class="filters">
      <label>Marca<select id="f-marca"></select></label>
      <label>Producto<select id="f-producto"></select></label>
      <label>Talle<select id="f-talle"></select></label>
      <label>Tipo<select id="f-tipo"></select></label>
      <label>Color<select id="f-color"></select></label>
      <button class="sec" id="reset">Limpiar</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"><div class="empty">Cargando...</div></div>
</main>

<script>
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.GISHOP_CONFIG;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const MARCAS = ["VOUK","VITAL","Hyperfly","Future","Progress","Bearfoot"];
const PRODUCTOS = ["Rushguard","Shorts"];
const TALLES = ["XS","S","M","L","XL","XXL"];
const FILTROS = ["f-marca","f-producto","f-talle","f-tipo","f-color"];
let models = [];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n || 0).toLocaleString("es-AR", {style:"currency", currency:"ARS", maximumFractionDigits:0});

function fill(id, arr, all) {
  const prev = $(id).value;
  $(id).innerHTML = `<option value="">${all}</option>` + arr.map(v => `<option>${esc(v)}</option>`).join("");
  if ([...$(id).options].some(o => o.value === prev)) $(id).value = prev;
}
fill("f-marca", MARCAS, "Todas");
fill("f-producto", PRODUCTOS, "Todos");
fill("f-talle", TALLES, "Todos");
fill("f-tipo", TIPOS, "Todos");
FILTROS.forEach(id => $(id).addEventListener("change", render));
$("reset").addEventListener("click", () => { FILTROS.forEach(id => $(id).value = ""); render(); });

const sortVariants = vs => [...vs].sort((a, b) =>
  TALLES.indexOf(a.talle) - TALLES.indexOf(b.talle) || (a.color || "").localeCompare(b.color || ""));

function groupByColor(vs) {
  const map = new Map();
  sortVariants(vs).forEach(v => {
    if (!map.has(v.color)) map.set(v.color, []);
    map.get(v.color).push(v);
  });
  return [...map.entries()];
}

async function load() {
  const { data, error } = await sb
    .from("product_models")
    .select("*, product_variants(*)")
    .order("marca")
    .order("created_at");
  if (error) { $("grid").innerHTML = `<div class="empty err">${esc(error.message)}</div>`; return; }
  models = data.map(md => ({ ...md, product_variants: md.product_variants || [] }));
  fill("f-color", [...new Set(models.flatMap(md => md.product_variants.map(v => v.color).filter(Boolean)))].sort(), "Todos");
  render();
}

function render() {
  const m = $("f-marca").value, p = $("f-producto").value;
  const t = $("f-talle").value, c = $("f-color").value;
  const tp = $("f-tipo").value;

  const list = models.filter(md =>
    (!m || md.marca === m) &&
    (!p || md.producto === p) &&
    (!tp || TIPO_POR_PRODUCTO[md.producto] === tp) &&
    (!t || md.product_variants.some(v => v.talle === t)) &&
    (!c || md.product_variants.some(v => v.color === c)));

  const units = list.reduce((a, md) => a + md.product_variants.reduce((s, v) => s + v.stock, 0), 0);
  const disponibles = list.filter(md => md.product_variants.some(v => v.stock > 0)).length;
  $("stats").innerHTML = `
    <div class="stat"><small>Modelos</small><b>${list.length}</b></div>
    <div class="stat"><small>Unidades en stock</small><b>${units}</b></div>
    <div class="stat"><small>Con disponibilidad</small><b>${disponibles}</b></div>`;

  $("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">No hay productos con esos filtros.</div>`;
}


function card(md) {
  const colores = groupByColor(md.product_variants);
  return `
    <div class="item">
      ${md.imagen_url
        ? `<img src="${esc(md.imagen_url)}" alt="${esc(md.producto)} ${esc(md.marca)}" loading="lazy">`
        : `<div class="noimg" style="height:200px">Sin imagen</div>`}
      <div class="body">
        <h3>${esc(md.marca)} · ${esc(md.producto)} <span class="badge">${TIPO_POR_PRODUCTO[md.producto] || ""}</span></h3>
        <div class="meta">
          ${esc(md.nombre)}<br>
          Precio: <b>${money(md.precio)}</b>
        </div>
        ${colores.length ? colores.map(([color, vs]) => `
          <div class="color-block">
            <b>${esc(color || "Único")}</b>
            <div class="sizes">
              ${vs.map(v => `<span class="size ${v.stock > 0 ? "in" : "out"}">${esc(v.talle)} · ${v.stock}</span>`).join("")}
            </div>
          </div>`).join("") : `<div class="meta">Sin talles cargados</div>`}
      </div>
    </div>`;
}

load();
</script>
</body>
</html>
